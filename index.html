<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>スタンプカード</title>
    <!-- PWA: manifest + iOS full screen meta -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo",
          sans-serif;
        background: #ccc;
        color: #222;
      }
      .wrapper {
        max-width: none;
        margin: 0 auto;
        padding: 0;
      }
      .image-frame {
        position: relative;
        /* ビューポート内で16:9を最大化 */
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        margin: 0 auto;
        background: #000;
        overflow: hidden;
      }
      /* モバイルのツールバーを考慮（対応ブラウザではdvh/dvwを使用） */
      @supports (height: 100dvh) and (width: 100dvw) {
        .image-frame {
          width: min(100dvw, calc(100dvh * 16 / 9));
          height: min(100dvh, calc(100dvw * 9 / 16));
        }
      }
      .image-frame img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: transparent;
      }
      /* 画像実表示領域に一致させるオーバーレイ */
      .card-box {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* 名前（カードサイズに追従） */
      .name-badge {
        position: absolute;
        left: calc(var(--card-w, 0px) * 0.73);
        top: calc(var(--card-h, 0px) * 0.07);
        color: #5a3b13;
        font-family: "Yusei Magic", "Noto Sans JP", system-ui, sans-serif;
        font-size: calc(var(--card-h, 0px) * 0.05); /* 1080基準 ~54px */
        line-height: 1.2;
        z-index: 3;
        text-align: left;
        max-width: 24%;
        word-break: break-word;
        /* 白縁（外側のみ） */
        text-shadow: 1px 0 0 #fff, -1px 0 0 #fff, 0 1px 0 #fff, 0 -1px 0 #fff,
          1px 1px 0 #fff, -1px 1px 0 #fff, 1px -1px 0 #fff, -1px -1px 0 #fff,
          2px 0 0 #fff, -2px 0 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff,
          2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff;
      }

      /* アップロードスタンプ（カード全面に重ねる） */
      .overlay-stamps {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }
      .overlay-stamp {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        /* CHANGED: show by default; hide via [hidden] or empty src */
        display: block;
        image-rendering: auto;
      }
      /* src未設定や空文字のimgは常に非表示（壊れアイコン対策） */
      .overlay-stamp:not([src]),
      .overlay-stamp[src=""] {
        display: none !important;
      }
      /* NEW: respect [hidden] attribute explicitly */
      .overlay-stamp[hidden] {
        display: none !important;
      }

      .controls {
        margin-top: 16px;
        background: #fff;
        padding: 12px;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      .controls .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .controls input[type="text"] {
        flex: 1 1 320px;
        min-width: 240px;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      /* Name row: keep on one line regardless of window size */
      .controls .row.inline-form {
        flex-wrap: nowrap;
        overflow-x: auto; /* scroll horizontally if too narrow */
      }
      .controls .row.inline-form label {
        flex: 0 0 84px; /* align with stamp label width */
        white-space: nowrap;
      }
      .controls .row.inline-form input[type="text"] {
        flex: 1 1 auto; /* grow/shrink */
        min-width: 0; /* allow shrinking */
      }
      /* ADD: name row bottom margin (only in the top "選択" controls block) */
      .controls[aria-labelledby="controlsTitle"] .row.inline-form {
        margin-bottom: 4px;
      }
      .checkbox-grid {
        display: flex;
        flex-direction: column;
        gap: 4px;
        /* margin-top: 12px;  ← 既に上位で設定済み */
      }
      .day-row {
        display: flex;
        column-gap: 4px; /* CHANGED: was gap: 8px */
        align-items: center;
        flex-wrap: nowrap;
        margin: 0; /* CHANGED: vertical margins to 0 */
        overflow-x: auto;
      }
      .day-row .day-label {
        min-width: 84px;
        font-weight: 600;
        flex: 0 0 84px;
      }
      /* CHANGED: hide native file input; we will trigger it from a button */
      .day-row input[type="file"] {
        display: none;
      }
      /* NEW: visible "ファイル選択" button style */
      .day-row .select-btn {
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .day-row .filename {
        color: #666;
        font-size: 0.9em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 0 1 30%;
        min-width: 80px;
      }
      .day-row .clear-btn {
        display: none;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      details.accordion {
        margin-top: 12px;
      }
      details.accordion > summary {
        cursor: pointer;
        font-weight: 600;
        list-style: none;
        padding: 6px 0;
      }
      details.accordion > summary::-webkit-details-marker {
        display: none;
      }
      details.accordion > summary::before {
        content: "▸";
        display: inline-block;
        width: 1em;
        margin-right: 6px;
        transition: transform 0.2s ease;
      }
      details.accordion[open] > summary::before {
        content: "▾";
      }
      .settings-fields {
        margin-top: 8px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .settings-fields .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .settings-fields label {
        min-width: 120px;
      }
      .settings-fields input[type="text"] {
        flex: 1 1 420px;
        min-width: 260px;
      }
      /* Keep button on the right side of the text box in settings rows */
      .settings-fields .row.inline-form {
        flex-wrap: nowrap;
      }
      .settings-fields .row.inline-form input[type="text"] {
        flex: 1 1 auto; /* grow/shrink */
        min-width: 0; /* allow shrinking on small screens */
      }
      .settings-fields .row.inline-form .settings-actions {
        flex: 0 0 auto;
      }
      .settings-fields .row.inline-form .settings-actions button {
        white-space: nowrap;
      }
      .settings-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fafafa;
        cursor: pointer;
      }
      button:hover {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <!-- 画像表示領域（1920x1080 / 16:9） -->
      <div class="image-frame" id="imageFrame">
        <img
          id="mainImage"
          alt="1920x1080 画像"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080' viewBox='0 0 1920 1080'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23212529'/><stop offset='100%25' stop-color='%2355769e'/></linearGradient></defs><rect width='100%25' height='100%25' fill='url(%23g)'/><text x='50%25' y='50%25' font-size='72' fill='white' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' dominant-baseline='middle'>1920 x 1080 Placeholder</text></svg>"
        />
        <div id="cardBox" class="card-box">
          <div class="overlay-stamps" id="overlayStamps">
            <!-- CHANGED: dynamic overlays will be appended here -->
          </div>
          <div class="name-badge" id="nameBadge" aria-live="polite"></div>
        </div>
      </div>

      <!-- コントロール領域 -->
      <div class="controls" role="region" aria-labelledby="controlsTitle">
        <h2 id="controlsTitle" style="margin: 0 0 8px 0; font-size: 18px">
          選択
        </h2>
        <div class="row inline-form">
          <label for="nameInput" style="min-width: 84px">名前</label>
          <input
            type="text"
            id="nameInput"
            placeholder="名前を入力すると右上に表示します"
            value="匿名さん"
          />
        </div>

        <div class="checkbox-grid" id="uploadList">
          <!-- CHANGED: dynamic rows will be appended here -->
        </div>

        <!-- 追加: PNGで保存 -->
        <div class="row" style="justify-content: flex-end; margin-top: 8px">
          <button type="button" id="exportPngBtn">PNGで保存</button>
        </div>
      </div>

      <!-- 設定（アコーディオン、初期は閉じる） -->
      <div class="controls" role="region" aria-labelledby="settingsTitle">
        <div
          style="
            margin-bottom: 12px;
            padding: 10px;
            border: 1px dashed #bbb;
            border-radius: 8px;
            background: #fafafa;
            color: #333;
            font-size: 13px;
            line-height: 1.6;
          "
        >
          フルスクリーンで使うには：
          <ul style="margin: 6px 0 0 18px; padding: 0">
            <li>
              iOS Safari: 共有ボタン →
              ホーム画面に追加（追加後はツールバー無しで全画面表示）
            </li>
            <li>
              Android Chrome: メニュー ⋮ →
              ホーム画面に追加（インストール後は全画面表示）
            </li>
          </ul>
          一時的にツールバーを隠すには、ページを少しスクロールしてください。
        </div>
        <details class="accordion" id="settingsAccordion">
          <summary id="settingsTitle">画像の設定</summary>
          <div class="settings-fields" aria-live="off">
            <div class="row inline-form">
              <label for="cardUrlInput">カード画像URL</label>
              <input
                type="text"
                id="cardUrlInput"
                placeholder="カード画像のURLを入力"
              />
              <div class="settings-actions">
                <button type="button" id="applyCardUrl">画像を適用</button>
              </div>
            </div>

            <!-- スタンプ画像のアップロードはコントローラー側へ移動しました -->

            <!-- MOVED HERE: 共有URLの生成とコピー -->
            <div class="row inline-form">
              <label for="shareUrlInput">共有URL</label>
              <input
                type="text"
                id="shareUrlInput"
                readonly
                placeholder="カードURLを入力すると生成します"
              />
              <div class="settings-actions">
                <button type="button" id="copyShareUrl">URLをコピー</button>
              </div>
            </div>
          </div>
        </details>
      </div>
    </div>

    <script>
      (function () {
        const img = document.getElementById("mainImage");
        const frame = document.getElementById("imageFrame");
        const cardBox = document.getElementById("cardBox");
        const overlayStamps = document.getElementById("overlayStamps");
        const uploadList = document.getElementById("uploadList");
        const nameBadge = document.getElementById("nameBadge");
        const nameInput = document.getElementById("nameInput");
        const cardUrlInput = document.getElementById("cardUrlInput");
        const applyCardBtn = document.getElementById("applyCardUrl");
        const exportPngBtn = document.getElementById("exportPngBtn");
        // NEW: share URL elements
        const shareUrlInput = document.getElementById("shareUrlInput");
        const copyShareBtn = document.getElementById("copyShareUrl");

        const DEFAULT_W = 1920;
        const DEFAULT_H = 1080;

        // NEW: persistence helpers (hash key = SHA-256 of card URL)
        async function sha256Hex(str) {
          try {
            const data = new TextEncoder().encode(str);
            const buf = await crypto.subtle.digest("SHA-256", data);
            const bytes = new Uint8Array(buf);
            return Array.from(bytes)
              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");
          } catch {
            // Fallback simple hash
            let h = 0;
            for (let i = 0; i < str.length; i++) {
              h = (h * 31 + str.charCodeAt(i)) | 0;
            }
            return ("00000000" + (h >>> 0).toString(16)).slice(-8);
          }
        }
        function getCurrentCardUrl() {
          return (cardUrlInput?.value || "").trim();
        }
        async function getStorageKeyForCurrentCard() {
          const url = getCurrentCardUrl();
          if (!url) return null;
          const hex = await sha256Hex(url);
          return `scard:${hex}`;
        }

        // NEW: collect and save current state (debounced)
        let saveTimer = 0;
        function saveCurrentStateDebounced() {
          if (saveTimer) clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            saveCurrentState().catch(() => {});
          }, 300);
        }
        async function saveCurrentState() {
          const key = await getStorageKeyForCurrentCard();
          if (!key) return; // card URL未指定時は保存しない
          const stamps = [];
          // 保存順はUI表示順
          Array.from(uploadList.children).forEach((row) => {
            const rowId = row.dataset.rowId;
            const info = rows.get(rowId);
            if (info && info.hasFile && info.dataUrl) {
              stamps.push({
                fileName: info.fname?.textContent || "",
                dataUrl: info.dataUrl,
              });
            }
          });
          const data = {
            name: nameInput.value || "",
            stamps,
          };
          try {
            localStorage.setItem(key, JSON.stringify(data));
          } catch {
            // ignore quota errors
          }
        }

        // NEW: clear current rows and overlays
        function clearAllRowsAndOverlays() {
          // remove overlays
          while (overlayStamps.firstChild) overlayStamps.firstChild.remove();
          // remove rows
          while (uploadList.firstChild) uploadList.firstChild.remove();
          rows.clear();
        }

        // NEW: load state for current card and rebuild UI
        async function loadStateForCurrentCard() {
          const key = await getStorageKeyForCurrentCard();
          clearAllRowsAndOverlays();
          if (!key) {
            addUploadRow(); // ensure 1 empty row
            reindexRows();
            updateName(); // keep current name input as-is
            return;
          }
          let parsed = null;
          try {
            const raw = localStorage.getItem(key);
            if (raw) parsed = JSON.parse(raw);
          } catch {}
          // name
          if (parsed && typeof parsed.name === "string") {
            nameInput.value = parsed.name;
          }
          updateName();
          // stamps
          if (parsed && Array.isArray(parsed.stamps) && parsed.stamps.length) {
            for (const s of parsed.stamps) {
              const rid = addUploadRow();
              const info = rows.get(rid);
              if (!info) continue;
              // ensure overlay
              if (!info.overlayImg) {
                const oimg = document.createElement("img");
                oimg.className = "overlay-stamp";
                oimg.alt = "";
                overlayStamps.appendChild(oimg);
                info.overlayImg = oimg;
              }
              info.overlayImg.src = s.dataUrl || "";
              info.overlayImg.hidden = !s.dataUrl;
              info.dataUrl = s.dataUrl || "";
              info.fname.textContent = s.fileName || "画像";
              info.input.disabled = true;
              info.input.style.display = "none";
              info.clearBtn.style.display = "inline-block";
              info.hasFile = !!s.dataUrl;
              // NEW: hide select button after restore
              if (info.selectBtn) {
                info.selectBtn.disabled = true;
                info.selectBtn.style.display = "none";
              }
              // keep delete on the left
              info.row.insertBefore(info.clearBtn, info.fname);
              info.row.classList.add("has-file");
            }
          }
          // trailing empty row
          addUploadRow();
          reindexRows();
        }

        // NEW: dynamic rows and overlays (add dataUrl field)
        // CHANGED: include selectBtn in row state
        const rows = new Map(); // rowId -> { row, label, selectBtn, input, fname, clearBtn, overlayImg, objectUrl, dataUrl, hasFile }
        let rowSeq = 0;

        function addUploadRow() {
          rowSeq += 1;
          const rowId = String(rowSeq);

          const row = document.createElement("div");
          row.className = "day-row";
          row.dataset.rowId = rowId;

          const label = document.createElement("span");
          label.className = "day-label";
          label.textContent = `${uploadList.children.length + 1}つめ`;

          // NEW: hidden native input
          const input = document.createElement("input");
          input.type = "file";
          input.accept = "image/png,image/*";
          input.style.display = "none";

          // NEW: visible trigger button
          const selectBtn = document.createElement("button");
          selectBtn.type = "button";
          selectBtn.className = "select-btn";
          selectBtn.textContent = "ファイル選択";
          selectBtn.addEventListener("click", () => {
            input.click();
          });

          const fname = document.createElement("span");
          fname.className = "filename";
          // CHANGED: no placeholder text for empty rows
          fname.textContent = "";

          const clearBtn = document.createElement("button");
          clearBtn.type = "button";
          clearBtn.className = "clear-btn";
          clearBtn.textContent = "削除";
          clearBtn.style.display = "none";

          // CHANGED: order -> label, selectBtn, input(hidden), filename, clear
          row.append(label, selectBtn, input, fname, clearBtn);
          uploadList.appendChild(row);

          rows.set(rowId, {
            row,
            label,
            selectBtn,
            input,
            fname,
            clearBtn,
            overlayImg: null,
            objectUrl: null,
            dataUrl: null,
            hasFile: false,
          });

          // CHANGED: read file as Data URL (for persistence), set overlay, then save
          input.addEventListener("change", () => {
            const file = input.files && input.files[0];
            if (!file) return;

            const info = rows.get(rowId);
            if (!info) return;

            if (!info.overlayImg) {
              const oimg = document.createElement("img");
              oimg.className = "overlay-stamp";
              oimg.alt = "";
              overlayStamps.appendChild(oimg);
              info.overlayImg = oimg;
            }

            const reader = new FileReader();
            reader.onload = () => {
              const dataUrl = String(reader.result || "");
              info.dataUrl = dataUrl;
              info.overlayImg.src = dataUrl;
              info.overlayImg.hidden = false;

              // prevent reselection; hide select button and native input
              info.input.disabled = true;
              info.input.style.display = "none";
              if (info.selectBtn) {
                info.selectBtn.disabled = true;
                info.selectBtn.style.display = "none";
              }

              info.fname.textContent = file.name;
              info.clearBtn.style.display = "inline-block";
              info.hasFile = true;

              // keep delete button left of filename
              info.row.insertBefore(info.clearBtn, info.fname);
              info.row.classList.add("has-file");

              saveCurrentStateDebounced();
              ensureTrailingEmptyRow();
            };
            reader.readAsDataURL(file);
          });

          clearBtn.addEventListener("click", () => {
            removeRow(rowId);
            saveCurrentStateDebounced();
          });

          return rowId;
        }

        function removeRow(rowId) {
          const info = rows.get(rowId);
          if (!info) return;

          if (info.objectUrl) {
            URL.revokeObjectURL(info.objectUrl);
          }
          if (info.overlayImg) {
            info.overlayImg.remove();
          }
          info.row.remove();
          rows.delete(rowId);

          reindexRows();

          // Always keep at least one empty row; also keep a trailing empty row if all are filled
          if (uploadList.children.length === 0 || allRowsHaveFiles()) {
            addUploadRow();
          }
        }

        function reindexRows() {
          Array.from(uploadList.children).forEach((row, idx) => {
            const label = row.querySelector(".day-label");
            if (label) label.textContent = `${idx + 1}つめ`;
          });
        }

        // ADD: rAF-throttled layout updater used below
        let rafId = 0;
        function scheduleUpdateCardBoxRect() {
          if (rafId) return;
          rafId = requestAnimationFrame(() => {
            rafId = 0;
            updateCardBoxRect();
          });
        }

        function allRowsHaveFiles() {
          let hasAny = false;
          for (const info of rows.values()) {
            hasAny = true;
            if (!info.hasFile) return false;
          }
          return hasAny;
        }

        function ensureTrailingEmptyRow() {
          if (allRowsHaveFiles()) addUploadRow();
        }

        function updateName() {
          const text = nameInput.value.trim();
          nameBadge.textContent = text;
          nameBadge.style.display = text ? "block" : "none";
        }

        // Also save name on change
        nameInput.addEventListener("input", () => {
          updateName();
          saveCurrentStateDebounced();
        });

        // NEW: helper to draw outlined text with outer-only outline
        function drawOutlinedText(
          ctx,
          text,
          x,
          y,
          fontSize,
          fontFamily,
          outlinePx,
          fillColor = "#5a3b13",
          outlineColor = "#ffffff"
        ) {
          if (!text) return;
          const { canvas } = ctx;
          const outlineCanvas = document.createElement("canvas");
          outlineCanvas.width = canvas.width;
          outlineCanvas.height = canvas.height;
          const octx = outlineCanvas.getContext("2d");
          octx.font = `${fontSize}px ${fontFamily}`;
          octx.textBaseline = "alphabetic";
          octx.textAlign = "left";
          octx.lineJoin = "round";

          // draw wider stroke, then punch out the inner fill to keep only the outer rim
          const strokeDrawWidth = Math.max(2, Math.round(outlinePx * 2));
          octx.strokeStyle = outlineColor;
          octx.lineWidth = strokeDrawWidth;
          octx.strokeText(text, x, y);

          octx.globalCompositeOperation = "destination-out";
          octx.fillStyle = "#000";
          octx.fillText(text, x, y);

          // paint outline then fill main text
          ctx.drawImage(outlineCanvas, 0, 0);
          ctx.font = `${fontSize}px ${fontFamily}`;
          ctx.textBaseline = "alphabetic";
          ctx.textAlign = "left";
          ctx.fillStyle = fillColor;
          ctx.fillText(text, x, y);
        }

        // PNG書き出し
        async function exportAsPNG() {
          try {
            // フォント読み込み完了を待つ
            if (document.fonts && document.fonts.ready) {
              try {
                await document.fonts.ready;
              } catch {}
            }

            const natW = img.naturalWidth || DEFAULT_W;
            const natH = img.naturalHeight || DEFAULT_H;

            const canvas = document.createElement("canvas");
            canvas.width = natW;
            canvas.height = natH;
            const ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";

            // ベース（カード）
            ctx.drawImage(img, 0, 0, natW, natH);

            // スタンプ（DOM順に重ねる）
            const overlays =
              overlayStamps.querySelectorAll("img.overlay-stamp");
            overlays.forEach((o) => {
              if (o && o.src && !o.hidden) {
                ctx.drawImage(o, 0, 0, natW, natH);
              }
            });

            // 名前描画
            const nameText = (nameInput.value || "").trim();
            if (nameText) {
              // 画面座標→自然サイズへ変換
              const boxRect = cardBox.getBoundingClientRect();
              const nmRect = nameBadge.getBoundingClientRect();
              const scaleX = natW / boxRect.width;
              const scaleY = natH / boxRect.height;

              const fsPx = parseFloat(
                getComputedStyle(nameBadge).fontSize || "0"
              );
              const fontSize = Math.max(1, Math.round(fsPx * scaleY));
              const nameX = Math.round((nmRect.left - boxRect.left) * scaleX);
              const nameY = Math.round(
                (nmRect.top - boxRect.top) * scaleY + fontSize
              );

              const fontFamily = "'Yusei Magic','Noto Sans JP',sans-serif";
              const outlineTarget = Math.max(1, Math.round(2 * scaleY));

              // REFACTORED: use helper
              drawOutlinedText(
                ctx,
                nameText,
                nameX,
                nameY,
                fontSize,
                fontFamily,
                outlineTarget,
                "#5a3b13",
                "#ffffff"
              );
            }

            // PNG化
            canvas.toBlob((blob) => {
              if (!blob) {
                alert(
                  "PNGの作成に失敗しました。外部画像のCORS制限の可能性があります。カード画像はローカルから選択するか、CORS許可の画像をご利用ください。"
                );
                return;
              }
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = "card.png";
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, "image/png");
          } catch (e) {
            console.error(e);
            alert("PNGの書き出しに失敗しました。");
          }
        }

        if (exportPngBtn) {
          exportPngBtn.addEventListener("click", exportAsPNG);
        }

        // カードURL適用（CORS考慮）
        function applyCardUrl() {
          const url = (cardUrlInput?.value || "").trim();
          if (!url) {
            const u = new URL(location.href);
            u.searchParams.delete("card");
            history.replaceState(null, "", u.href);
            updateShareUrl();
            // when cleared, reset UI to fresh state
            clearAllRowsAndOverlays();
            addUploadRow();
            reindexRows();
            return;
          }
          img.crossOrigin = "anonymous";
          img.referrerPolicy = "no-referrer";
          img.src = url;
          const u = new URL(location.href);
          u.searchParams.set("card", url);
          history.replaceState(null, "", u.href);
          updateShareUrl();

          // NEW: clear current UI immediately to avoid stale name/stamps while loading
          try {
            clearAllRowsAndOverlays();
            nameInput.value = "匿名さん";
            updateName();
            addUploadRow();
            reindexRows();
          } catch {}

          // Load saved state for this card URL (name, stamps) from localStorage
          loadStateForCurrentCard().catch(() => {});

          img
            .decode?.()
            .catch(() => {})
            .finally(scheduleUpdateCardBoxRect);
        }

        // object-fit: contain の実表示領域を計算し cardBox に反映
        function updateCardBoxRect() {
          if (!img || !frame || !cardBox) return;
          const fw = frame.clientWidth;
          const fh = frame.clientHeight;
          const natW = img.naturalWidth || DEFAULT_W;
          const natH = img.naturalHeight || DEFAULT_H;
          if (fw === 0 || fh === 0 || natW === 0 || natH === 0) return;
          const scale = Math.min(fw / natW, fh / natH);
          const drawW = natW * scale;
          const drawH = natH * scale;
          const offsetX = (fw - drawW) / 2;
          const offsetY = (fh - drawH) / 2;
          cardBox.style.left = offsetX + "px";
          cardBox.style.top = offsetY + "px";
          cardBox.style.width = drawW + "px";
          cardBox.style.height = drawH + "px";
          cardBox.style.setProperty("--card-w", `${drawW}px`);
          cardBox.style.setProperty("--card-h", `${drawH}px`);
          const scaleX = drawW / DEFAULT_W;
          const scaleY = drawH / DEFAULT_H;
          cardBox.style.setProperty("--card-scale-x", String(scaleX));
          cardBox.style.setProperty("--card-scale-y", String(scaleY));
        }

        // NEW: 共有URLを入力値から生成
        function updateShareUrl() {
          const v = (cardUrlInput?.value || "").trim();
          if (!shareUrlInput) return;
          const u = new URL(location.href);
          if (v) {
            u.searchParams.set("card", v);
            shareUrlInput.value = u.href;
          } else {
            u.searchParams.delete("card");
            shareUrlInput.value = "";
          }
        }

        // NEW: 共有URLのコピー
        function copyShareUrl() {
          const v = shareUrlInput?.value || "";
          if (!v) return;
          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(v).catch(() => {});
          } else {
            shareUrlInput.select();
            try {
              document.execCommand("copy");
            } catch {}
            shareUrlInput.blur();
          }
        }

        // Listeners
        nameInput.addEventListener("input", updateName);
        if (applyCardBtn) applyCardBtn.addEventListener("click", applyCardUrl);
        if (cardUrlInput) {
          cardUrlInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") applyCardUrl();
          });
          // NEW: also apply on input change (blur), to re-fetch and re-set from localStorage
          cardUrlInput.addEventListener("change", applyCardUrl);
        }
        if (copyShareBtn) {
          copyShareBtn.addEventListener("click", copyShareUrl);
        }

        // 初期化
        // NEW: ?card= を読み込んで反映
        try {
          const params = new URLSearchParams(location.search);
          const cardParam = params.get("card");
          if (cardParam) {
            cardUrlInput.value = cardParam;
          }
        } catch {}
        updateName();
        // REPLACE: start empty; load state if card param present; otherwise add one row
        (async () => {
          if ((cardUrlInput?.value || "").trim()) {
            await loadStateForCurrentCard();
          } else {
            addUploadRow();
          }
          updateCardBoxRect();
        })();

        window.addEventListener("load", () => {
          try {
            applyCardUrl();
          } catch (_) {}
          scheduleUpdateCardBoxRect();
        });
        window.addEventListener("resize", scheduleUpdateCardBoxRect);
        if (window.visualViewport) {
          window.visualViewport.addEventListener(
            "resize",
            scheduleUpdateCardBoxRect
          );
          window.visualViewport.addEventListener(
            "scroll",
            scheduleUpdateCardBoxRect
          );
        }
        img.addEventListener("load", scheduleUpdateCardBoxRect);
      })();

      // PWA: Service Worker 登録（対応ブラウザのみ）
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
