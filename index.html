<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>画像表示 + コントローラー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --max-width: 1920px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo",
          sans-serif;
        background: #ccc;
        color: #222;
      }
      .wrapper {
        max-width: none;
        margin: 0 auto;
        padding: 0;
      }
      .image-frame {
        position: relative;
        /* ビューポート内で16:9を最大化 */
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        margin: 0 auto;
        background: #000;
        overflow: hidden;
      }
      .image-frame img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: transparent;
      }
      /* 画像実表示領域に一致させるオーバーレイ */
      .card-box {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* 名前（カードサイズに追従） */
      .name-badge {
        position: absolute;
        left: calc(var(--card-w, 0px) * 0.73);
        top: calc(var(--card-h, 0px) * 0.07);
        color: #5a3b13;
        font-family: "Yusei Magic", "Noto Sans JP", system-ui, sans-serif;
        font-size: calc(var(--card-h, 0px) * 0.05); /* 1080基準 ~54px */
        line-height: 1.2;
        z-index: 3;
        text-align: left;
        max-width: 24%;
        word-break: break-word;
        /* 白縁（外側のみ） */
        text-shadow: 1px 0 0 #fff, -1px 0 0 #fff, 0 1px 0 #fff, 0 -1px 0 #fff,
          1px 1px 0 #fff, -1px 1px 0 #fff, 1px -1px 0 #fff, -1px -1px 0 #fff,
          2px 0 0 #fff, -2px 0 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff,
          2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff;
      }

      /* スタンプ帯（カードサイズに追従） */
      .stamps {
        /* 入力された余白・間隔（1920px幅を基準としたpx） */
        --stamps-left-base: 48px;
        --stamps-right-base: 48px;
        --stamps-gap-base: 8px;
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(var(--card-h, 0px) * 0.1);
        height: 20%;
        /* 横方向スケールに追従させる */
        padding: 8px calc(var(--stamps-right-base) * var(--card-scale-x, 1)) 8px
          calc(var(--stamps-left-base) * var(--card-scale-x, 1));
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        align-items: end;
        justify-items: center;
        gap: calc(var(--stamps-gap-base) * var(--card-scale-x, 1));
        z-index: 1;
        pointer-events: none;
      }
      .stamps img.stamp {
        max-height: 100%;
        max-width: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        display: none;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
        pointer-events: none;
      }
      /* 各スタンプの列を固定（非表示でも枠は保持） */
      #stamp1 {
        grid-column: 1;
      }
      #stamp2 {
        grid-column: 2;
      }
      #stamp3 {
        grid-column: 3;
      }
      #stamp4 {
        grid-column: 4;
      }
      #stamp5 {
        grid-column: 5;
      }
      #stamp6 {
        grid-column: 6;
      }
      #stamp7 {
        grid-column: 7;
      }

      .controls {
        margin-top: 16px;
        background: #fff;
        padding: 12px;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      .controls .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .controls input[type="text"] {
        flex: 1 1 320px;
        min-width: 240px;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 8px 16px;
        margin-top: 12px;
      }
      .checkbox-grid label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      details.accordion {
        margin-top: 12px;
      }
      details.accordion > summary {
        cursor: pointer;
        font-weight: 600;
        list-style: none;
        padding: 6px 0;
      }
      details.accordion > summary::-webkit-details-marker {
        display: none;
      }
      details.accordion > summary::before {
        content: "▸";
        display: inline-block;
        width: 1em;
        margin-right: 6px;
        transition: transform 0.2s ease;
      }
      details.accordion[open] > summary::before {
        content: "▾";
      }
      .settings-fields {
        margin-top: 8px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .settings-fields .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .settings-fields label {
        min-width: 120px;
      }
      .settings-fields input[type="text"] {
        flex: 1 1 420px;
        min-width: 260px;
      }
      .settings-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fafafa;
        cursor: pointer;
      }
      button:hover {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <!-- 画像表示領域（1920x1080 / 16:9） -->
      <div class="image-frame" id="imageFrame">
        <img
          id="mainImage"
          alt="1920x1080 画像"
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080' viewBox='0 0 1920 1080'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23212529'/><stop offset='100%25' stop-color='%2355769e'/></linearGradient></defs><rect width='100%25' height='100%25' fill='url(%23g)'/><text x='50%25' y='50%25' font-size='72' fill='white' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' dominant-baseline='middle'>1920 x 1080 Placeholder</text></svg>"
        />
        <div id="cardBox" class="card-box">
          <div class="name-badge" id="nameBadge" aria-live="polite"></div>
          <!-- stamps overlay at bottom -->
          <div class="stamps" id="stamps">
            <img id="stamp1" class="stamp" alt="8/18 スタンプ" />
            <img id="stamp2" class="stamp" alt="8/19 スタンプ" />
            <img id="stamp3" class="stamp" alt="8/20 スタンプ" />
            <img id="stamp4" class="stamp" alt="8/21 スタンプ" />
            <img id="stamp5" class="stamp" alt="8/22 スタンプ" />
            <img id="stamp6" class="stamp" alt="8/23 スタンプ" />
            <img id="stamp7" class="stamp" alt="8/24 スタンプ" />
          </div>
        </div>
      </div>

      <!-- コントロール領域 -->
      <div class="controls" role="region" aria-labelledby="controlsTitle">
        <h2 id="controlsTitle" style="margin: 0 0 8px 0; font-size: 18px">
          コントローラー
        </h2>
        <div class="row">
          <label for="nameInput" style="min-width: 84px">名前</label>
          <input
            type="text"
            id="nameInput"
            placeholder="名前を入力すると右上に表示します"
            value="匿名さん"
          />
        </div>

        <div class="checkbox-grid" style="margin-top: 12px">
          <label><input type="checkbox" id="dayToggle1" /> 8/18 を表示</label>
          <label><input type="checkbox" id="dayToggle2" /> 8/19 を表示</label>
          <label><input type="checkbox" id="dayToggle3" /> 8/20 を表示</label>
          <label><input type="checkbox" id="dayToggle4" /> 8/21 を表示</label>
          <label><input type="checkbox" id="dayToggle5" /> 8/22 を表示</label>
          <label><input type="checkbox" id="dayToggle6" /> 8/23 を表示</label>
          <label><input type="checkbox" id="dayToggle7" /> 8/24 を表示</label>
        </div>

        <p style="margin: 8px 0 0 0; color: #666; font-size: 12px">
          画像のURLを差し替える場合は、<code>mainImage</code> の
          <code>src</code> を変更してください（推奨サイズ 1920×1080）。
        </p>
      </div>

      <!-- 設定（アコーディオン、初期は閉じる） -->
      <div class="controls" role="region" aria-labelledby="settingsTitle">
        <details class="accordion" id="settingsAccordion">
          <summary id="settingsTitle">画像の設定</summary>
          <div class="settings-fields" aria-live="off">
            <div class="row">
              <label for="cardUrlInput">カード画像URL</label>
              <input
                type="text"
                id="cardUrlInput"
                value="https://pbs.twimg.com/media/GyjarrxaEAE81fU?format=jpg&name=large"
                placeholder="カード画像のURLを入力"
              />
              <div class="settings-actions">
                <button type="button" id="applyCardUrl">適用</button>
              </div>
            </div>

            <!-- スタンプのレイアウト調整 -->
            <div class="row">
              <label for="stampsLeft">スタンプ 左余白(px)</label>
              <input
                type="number"
                id="stampsLeft"
                value="48"
                min="0"
                step="1"
                style="max-width: 140px"
              />
              <label for="stampsRight">右余白(px)</label>
              <input
                type="number"
                id="stampsRight"
                value="48"
                min="0"
                step="1"
                style="max-width: 140px"
              />
              <label for="stampsGap">間隔(px)</label>
              <input
                type="number"
                id="stampsGap"
                value="8"
                min="0"
                step="1"
                style="max-width: 140px"
              />
            </div>

            <div class="row">
              <label for="stampUrl1">スタンプ1 画像URL</label
              ><input
                type="text"
                id="stampUrl1"
                placeholder=""
                value="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjBToPsZdOEkaKgCtvOzYVIuyNlUZaOArSXZBledFyWqywfle3Ifz2qKLbWHBRKV1iYSYTPpPXuyXfoICKgQ7r_Y3h1NcZBIW_uNvTCIkBWZF2S78XgA2no5MfLYQcQ2eNf9H-bNC15SDzs/s800/hanko_taihenyokudekimashita.png"
              />
            </div>
            <div class="row">
              <label for="stampUrl2">スタンプ2 画像URL</label
              ><input
                type="text"
                id="stampUrl2"
                placeholder=""
                value="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjBToPsZdOEkaKgCtvOzYVIuyNlUZaOArSXZBledFyWqywfle3Ifz2qKLbWHBRKV1iYSYTPpPXuyXfoICKgQ7r_Y3h1NcZBIW_uNvTCIkBWZF2S78XgA2no5MfLYQcQ2eNf9H-bNC15SDzs/s800/hanko_taihenyokudekimashita.png"
              />
            </div>
            <div class="row">
              <label for="stampUrl3">スタンプ3 画像URL</label
              ><input
                type="text"
                id="stampUrl3"
                placeholder=""
                value="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjBToPsZdOEkaKgCtvOzYVIuyNlUZaOArSXZBledFyWqywfle3Ifz2qKLbWHBRKV1iYSYTPpPXuyXfoICKgQ7r_Y3h1NcZBIW_uNvTCIkBWZF2S78XgA2no5MfLYQcQ2eNf9H-bNC15SDzs/s800/hanko_taihenyokudekimashita.png"
              />
            </div>
            <div class="row">
              <label for="stampUrl4">スタンプ4 画像URL</label
              ><input
                type="text"
                id="stampUrl4"
                placeholder=""
                value="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjBToPsZdOEkaKgCtvOzYVIuyNlUZaOArSXZBledFyWqywfle3Ifz2qKLbWHBRKV1iYSYTPpPXuyXfoICKgQ7r_Y3h1NcZBIW_uNvTCIkBWZF2S78XgA2no5MfLYQcQ2eNf9H-bNC15SDzs/s800/hanko_taihenyokudekimashita.png"
              />
            </div>
            <div class="row">
              <label for="stampUrl5">スタンプ5 画像URL</label
              ><input
                type="text"
                id="stampUrl5"
                placeholder=""
                value="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjBToPsZdOEkaKgCtvOzYVIuyNlUZaOArSXZBledFyWqywfle3Ifz2qKLbWHBRKV1iYSYTPpPXuyXfoICKgQ7r_Y3h1NcZBIW_uNvTCIkBWZF2S78XgA2no5MfLYQcQ2eNf9H-bNC15SDzs/s800/hanko_taihenyokudekimashita.png"
              />
            </div>
            <div class="row">
              <label for="stampUrl6">スタンプ6 画像URL</label
              ><input
                type="text"
                id="stampUrl6"
                placeholder=""
                value="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjBToPsZdOEkaKgCtvOzYVIuyNlUZaOArSXZBledFyWqywfle3Ifz2qKLbWHBRKV1iYSYTPpPXuyXfoICKgQ7r_Y3h1NcZBIW_uNvTCIkBWZF2S78XgA2no5MfLYQcQ2eNf9H-bNC15SDzs/s800/hanko_taihenyokudekimashita.png"
              />
            </div>
            <div class="row">
              <label for="stampUrl7">スタンプ7 画像URL</label
              ><input
                type="text"
                id="stampUrl7"
                placeholder=""
                value="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjBToPsZdOEkaKgCtvOzYVIuyNlUZaOArSXZBledFyWqywfle3Ifz2qKLbWHBRKV1iYSYTPpPXuyXfoICKgQ7r_Y3h1NcZBIW_uNvTCIkBWZF2S78XgA2no5MfLYQcQ2eNf9H-bNC15SDzs/s800/hanko_taihenyokudekimashita.png"
              />
            </div>
          </div>
        </details>
      </div>
    </div>

    <script>
      (function () {
        const img = document.getElementById("mainImage");
        const frame = document.getElementById("imageFrame");
        const cardBox = document.getElementById("cardBox");
        const nameBadge = document.getElementById("nameBadge");
        const nameInput = document.getElementById("nameInput");
        const dayToggles = [1, 2, 3, 4, 5, 6, 7].map((i) =>
          document.getElementById(`dayToggle${i}`)
        );
        const cardUrlInput = document.getElementById("cardUrlInput");
        const applyCardBtn = document.getElementById("applyCardUrl");
        const stampInputs = [1, 2, 3, 4, 5, 6, 7].map((i) =>
          document.getElementById(`stampUrl${i}`)
        );
        const stampImgs = [1, 2, 3, 4, 5, 6, 7].map((i) =>
          document.getElementById(`stamp${i}`)
        );
        const stampsContainer = document.getElementById("stamps");
        const stampsLeft = document.getElementById("stampsLeft");
        const stampsRight = document.getElementById("stampsRight");
        const stampsGap = document.getElementById("stampsGap");

        function updateStampVisibility() {
          for (let i = 0; i < 7; i++) {
            const show = !!dayToggles[i]?.checked;
            const hasSrc = !!stampImgs[i]?.getAttribute("src");
            if (stampImgs[i])
              stampImgs[i].style.display = show && hasSrc ? "block" : "none";
          }
        }

        function updateStampSrcs() {
          for (let i = 0; i < 7; i++) {
            const url = (stampInputs[i]?.value || "").trim();
            if (stampImgs[i]) {
              if (url) {
                stampImgs[i].src = url;
              } else {
                stampImgs[i].removeAttribute("src");
              }
            }
          }
          updateStampVisibility();
        }

        function updateStampsLayout() {
          if (!stampsContainer) return;
          const left = Math.max(0, Number(stampsLeft?.value) || 0);
          const right = Math.max(0, Number(stampsRight?.value) || 0);
          const gap = Math.max(0, Number(stampsGap?.value) || 0);
          // 1920px を基準としたベース値として設定（実際の表示はCSS側でスケール）
          stampsContainer.style.setProperty("--stamps-left-base", `${left}px`);
          stampsContainer.style.setProperty(
            "--stamps-right-base",
            `${right}px`
          );
          stampsContainer.style.setProperty("--stamps-gap-base", `${gap}px`);
        }

        function updateName() {
          const text = nameInput.value.trim();
          nameBadge.textContent = text;
          nameBadge.style.display = text ? "block" : "none";
        }

        function applyCardUrl() {
          const url = (cardUrlInput?.value || "").trim();
          if (!url) return;
          img.src = url;
          // 画像更新後にリサイズを再計算
          img
            .decode?.()
            .catch(() => {})
            .finally(updateCardBoxRect);
        }

        // object-fit: contain の実表示領域を計算し cardBox に反映
        function updateCardBoxRect() {
          if (!img || !frame || !cardBox) return;
          const fw = frame.clientWidth;
          const fh = frame.clientHeight;
          const natW = img.naturalWidth || 1920;
          const natH = img.naturalHeight || 1080;
          if (fw === 0 || fh === 0 || natW === 0 || natH === 0) return;
          const scale = Math.min(fw / natW, fh / natH);
          const drawW = natW * scale;
          const drawH = natH * scale;
          const offsetX = (fw - drawW) / 2;
          const offsetY = (fh - drawH) / 2;
          cardBox.style.left = offsetX + "px";
          cardBox.style.top = offsetY + "px";
          cardBox.style.width = drawW + "px";
          cardBox.style.height = drawH + "px";
          // CSS 変数でカードサイズとスケールを共有
          cardBox.style.setProperty("--card-w", `${drawW}px`);
          cardBox.style.setProperty("--card-h", `${drawH}px`);
          const scaleX = drawW / 1920;
          const scaleY = drawH / 1080;
          cardBox.style.setProperty("--card-scale-x", String(scaleX));
          cardBox.style.setProperty("--card-scale-y", String(scaleY));
          // スタンプ帯にもスケールを反映（継承しない場合に備えて明示設定）
          if (stampsContainer) {
            stampsContainer.style.setProperty("--card-scale-x", String(scaleX));
            stampsContainer.style.setProperty("--card-scale-y", String(scaleY));
          }
          // レイアウト依存値を更新
          updateStampsLayout();
        }

        nameInput.addEventListener("input", updateName);
        dayToggles.forEach(
          (c) => c && c.addEventListener("change", updateStampVisibility)
        );
        stampInputs.forEach(
          (inp) => inp && inp.addEventListener("change", updateStampSrcs)
        );
        [stampsLeft, stampsRight, stampsGap].forEach(
          (el) => el && el.addEventListener("input", updateStampsLayout)
        );
        if (applyCardBtn) applyCardBtn.addEventListener("click", applyCardUrl);
        if (cardUrlInput)
          cardUrlInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") applyCardUrl();
          });

        // 初期化
        updateName();
        updateStampSrcs();
        updateStampsLayout();
        updateCardBoxRect();

        // ページのロード完了時に、設定欄のカード画像URLを適用
        window.addEventListener("load", () => {
          try {
            applyCardUrl();
          } catch (_) {
            /* no-op */
          }
          updateCardBoxRect();
        });
        window.addEventListener("resize", updateCardBoxRect);
        img.addEventListener("load", updateCardBoxRect);

        // 16:9維持のフォールバックは不要（ビューポートフィット運用）
      })();
    </script>
  </body>
</html>
