<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>画像表示 + コントローラー</title>
    <!-- PWA: manifest + iOS full screen meta -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo",
          sans-serif;
        background: #ccc;
        color: #222;
      }
      .wrapper {
        max-width: none;
        margin: 0 auto;
        padding: 0;
      }
      .image-frame {
        position: relative;
        /* ビューポート内で16:9を最大化 */
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        margin: 0 auto;
        background: #000;
        overflow: hidden;
      }
      /* モバイルのツールバーを考慮（対応ブラウザではdvh/dvwを使用） */
      @supports (height: 100dvh) and (width: 100dvw) {
        .image-frame {
          width: min(100dvw, calc(100dvh * 16 / 9));
          height: min(100dvh, calc(100dvw * 9 / 16));
        }
      }
      .image-frame img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: transparent;
      }
      /* 画像実表示領域に一致させるオーバーレイ */
      .card-box {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* 名前（カードサイズに追従） */
      .name-badge {
        position: absolute;
        left: calc(var(--card-w, 0px) * 0.73);
        top: calc(var(--card-h, 0px) * 0.07);
        color: #5a3b13;
        font-family: "Yusei Magic", "Noto Sans JP", system-ui, sans-serif;
        font-size: calc(var(--card-h, 0px) * 0.05); /* 1080基準 ~54px */
        line-height: 1.2;
        z-index: 3;
        text-align: left;
        max-width: 24%;
        word-break: break-word;
        /* 白縁（外側のみ） */
        text-shadow: 1px 0 0 #fff, -1px 0 0 #fff, 0 1px 0 #fff, 0 -1px 0 #fff,
          1px 1px 0 #fff, -1px 1px 0 #fff, 1px -1px 0 #fff, -1px -1px 0 #fff,
          2px 0 0 #fff, -2px 0 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff,
          2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff;
      }

      /* アップロードスタンプ（カード全面に重ねる） */
      .overlay-stamps {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }
      .overlay-stamp {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        /* CHANGED: show by default; hide via [hidden] or empty src */
        display: block;
        image-rendering: auto;
      }
      /* src未設定や空文字のimgは常に非表示（壊れアイコン対策） */
      .overlay-stamp:not([src]),
      .overlay-stamp[src=""] {
        display: none !important;
      }
      /* NEW: respect [hidden] attribute explicitly */
      .overlay-stamp[hidden] {
        display: none !important;
      }

      .controls {
        margin-top: 16px;
        background: #fff;
        padding: 12px;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      .controls .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .controls input[type="text"] {
        flex: 1 1 320px;
        min-width: 240px;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      .checkbox-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
        /* margin-top: 12px;  ← 既に上位で設定済み */
      }
      .day-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .day-row .day-label {
        min-width: 64px;
        font-weight: 600;
      }
      .day-row .filename {
        color: #666;
        font-size: 0.9em;
      }
      .day-row .clear-btn {
        display: none;
      }
      details.accordion {
        margin-top: 12px;
      }
      details.accordion > summary {
        cursor: pointer;
        font-weight: 600;
        list-style: none;
        padding: 6px 0;
      }
      details.accordion > summary::-webkit-details-marker {
        display: none;
      }
      details.accordion > summary::before {
        content: "▸";
        display: inline-block;
        width: 1em;
        margin-right: 6px;
        transition: transform 0.2s ease;
      }
      details.accordion[open] > summary::before {
        content: "▾";
      }
      .settings-fields {
        margin-top: 8px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .settings-fields .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .settings-fields label {
        min-width: 120px;
      }
      .settings-fields input[type="text"] {
        flex: 1 1 420px;
        min-width: 260px;
      }
      .settings-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fafafa;
        cursor: pointer;
      }
      button:hover {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <!-- 画像表示領域（1920x1080 / 16:9） -->
      <div class="image-frame" id="imageFrame">
        <img
          id="mainImage"
          alt="1920x1080 画像"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080' viewBox='0 0 1920 1080'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23212529'/><stop offset='100%25' stop-color='%2355769e'/></linearGradient></defs><rect width='100%25' height='100%25' fill='url(%23g)'/><text x='50%25' y='50%25' font-size='72' fill='white' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' dominant-baseline='middle'>1920 x 1080 Placeholder</text></svg>"
        />
        <div id="cardBox" class="card-box">
          <div class="overlay-stamps" id="overlayStamps">
            <img id="overlay1" class="overlay-stamp" alt="" hidden />
            <img id="overlay2" class="overlay-stamp" alt="" hidden />
            <img id="overlay3" class="overlay-stamp" alt="" hidden />
            <img id="overlay4" class="overlay-stamp" alt="" hidden />
            <img id="overlay5" class="overlay-stamp" alt="" hidden />
            <img id="overlay6" class="overlay-stamp" alt="" hidden />
            <img id="overlay7" class="overlay-stamp" alt="" hidden />
            <img id="overlay8" class="overlay-stamp" alt="" hidden />
          </div>
          <div class="name-badge" id="nameBadge" aria-live="polite"></div>
        </div>
      </div>

      <!-- コントロール領域 -->
      <div class="controls" role="region" aria-labelledby="controlsTitle">
        <h2 id="controlsTitle" style="margin: 0 0 8px 0; font-size: 18px">
          コントローラー
        </h2>
        <div class="row">
          <label for="nameInput" style="min-width: 84px">名前</label>
          <input
            type="text"
            id="nameInput"
            placeholder="名前を入力すると右上に表示します"
            value="匿名さん"
          />
        </div>

        <div class="checkbox-grid">
          <!-- 日付ごとのアップロード行（既存） -->
          <div class="day-row">
            <span class="day-label">8/18</span>
            <input type="file" id="dateUpload1" accept="image/png,image/*" />
            <span class="filename" id="fileName1">未選択</span>
            <button type="button" class="clear-btn" id="clearStamp1">
              削除
            </button>
          </div>
          <div class="day-row">
            <span class="day-label">8/19</span>
            <input type="file" id="dateUpload2" accept="image/png,image/*" />
            <span class="filename" id="fileName2">未選択</span>
            <button type="button" class="clear-btn" id="clearStamp2">
              削除
            </button>
          </div>
          <div class="day-row">
            <span class="day-label">8/20</span>
            <input type="file" id="dateUpload3" accept="image/png,image/*" />
            <span class="filename" id="fileName3">未選択</span>
            <button type="button" class="clear-btn" id="clearStamp3">
              削除
            </button>
          </div>
          <div class="day-row">
            <span class="day-label">8/21</span>
            <input type="file" id="dateUpload4" accept="image/png,image/*" />
            <span class="filename" id="fileName4">未選択</span>
            <button type="button" class="clear-btn" id="clearStamp4">
              削除
            </button>
          </div>
          <div class="day-row">
            <span class="day-label">8/22</span>
            <input type="file" id="dateUpload5" accept="image/png,image/*" />
            <span class="filename" id="fileName5">未選択</span>
            <button type="button" class="clear-btn" id="clearStamp5">
              削除
            </button>
          </div>
          <div class="day-row">
            <span class="day-label">8/23</span>
            <input type="file" id="dateUpload6" accept="image/png,image/*" />
            <span class="filename" id="fileName6">未選択</span>
            <button type="button" class="clear-btn" id="clearStamp6">
              削除
            </button>
          </div>
          <div class="day-row">
            <span class="day-label">8/24</span>
            <input type="file" id="dateUpload7" accept="image/png,image/*" />
            <span class="filename" id="fileName7">未選択</span>
            <button type="button" class="clear-btn" id="clearStamp7">
              削除
            </button>
          </div>
        </div>

        <!-- 追加: PNGで保存 -->
        <div class="row" style="justify-content: flex-end; margin-top: 8px">
          <button type="button" id="exportPngBtn">PNGで保存</button>
        </div>
      </div>

      <!-- 設定（アコーディオン、初期は閉じる） -->
      <div class="controls" role="region" aria-labelledby="settingsTitle">
        <div
          style="
            margin-bottom: 12px;
            padding: 10px;
            border: 1px dashed #bbb;
            border-radius: 8px;
            background: #fafafa;
            color: #333;
            font-size: 13px;
            line-height: 1.6;
          "
        >
          フルスクリーンで使うには：
          <ul style="margin: 6px 0 0 18px; padding: 0">
            <li>
              iOS Safari: 共有ボタン →
              ホーム画面に追加（追加後はツールバー無しで全画面表示）
            </li>
            <li>
              Android Chrome: メニュー ⋮ →
              ホーム画面に追加（インストール後は全画面表示）
            </li>
          </ul>
          一時的にツールバーを隠すには、ページを少しスクロールしてください。
        </div>
        <details class="accordion" id="settingsAccordion">
          <summary id="settingsTitle">画像の設定</summary>
          <div class="settings-fields" aria-live="off">
            <div class="row">
              <label for="cardUrlInput">カード画像URL</label>
              <input
                type="text"
                id="cardUrlInput"
                value="https://pbs.twimg.com/media/GyjarrxaEAE81fU?format=jpg&name=large"
                placeholder="カード画像のURLを入力"
              />
              <div class="settings-actions">
                <button type="button" id="applyCardUrl">適用</button>
              </div>
            </div>

            <!-- スタンプ画像のアップロードはコントローラー側へ移動しました -->
          </div>
        </details>
      </div>
    </div>

    <script>
      (function () {
        const img = document.getElementById("mainImage");
        const frame = document.getElementById("imageFrame");
        const cardBox = document.getElementById("cardBox");
        const nameBadge = document.getElementById("nameBadge");
        const nameInput = document.getElementById("nameInput");
        const cardUrlInput = document.getElementById("cardUrlInput");
        const applyCardBtn = document.getElementById("applyCardUrl");
        const exportPngBtn = document.getElementById("exportPngBtn"); // 追加

        // NEW: defaults for 16:9 cards when natural size is not yet known
        const DEFAULT_W = 1920;
        const DEFAULT_H = 1080;

        // ローカルアップロードスタンプ（最大8枚）
        const overlayImgs = Array.from({ length: 8 }, (_, i) =>
          document.getElementById(`overlay${i + 1}`)
        );
        // コントローラー側の日付行にアップロード/削除を配置（1..7を使用、8は設定なしでも動作可能）
        const uploadInputs = Array.from({ length: 7 }, (_, i) =>
          document.getElementById(`dateUpload${i + 1}`)
        );
        const fileNameSpans = Array.from({ length: 7 }, (_, i) =>
          document.getElementById(`fileName${i + 1}`)
        );
        const clearButtons = Array.from({ length: 7 }, (_, i) =>
          document.getElementById(`clearStamp${i + 1}`)
        );
        // オブジェクトURLを追跡して解放
        const objectUrls = new Array(8).fill(null);

        // NEW: rAF-throttled layout updater to avoid redundant reflows
        let rafId = 0;
        function scheduleUpdateCardBoxRect() {
          if (rafId) return;
          rafId = requestAnimationFrame(() => {
            rafId = 0;
            updateCardBoxRect();
          });
        }

        function setFileName(i, name) {
          const span = fileNameSpans[i];
          if (span) span.textContent = name || "未選択";
          const btn = clearButtons[i];
          if (btn)
            btn.style.display =
              name && name !== "未選択" ? "inline-block" : "none";
        }

        function clearOverlay(i) {
          const imgEl = overlayImgs[i];
          if (!imgEl) return;
          if (objectUrls[i]) {
            URL.revokeObjectURL(objectUrls[i]);
            objectUrls[i] = null;
          }
          imgEl.removeAttribute("src");
          imgEl.hidden = true;
          if (uploadInputs[i]) uploadInputs[i].value = "";
          setFileName(i, "未選択");
        }

        function handleUpload(idx, file) {
          const imgEl = overlayImgs[idx];
          if (!imgEl || !file) return;
          if (objectUrls[idx]) {
            URL.revokeObjectURL(objectUrls[idx]);
            objectUrls[idx] = null;
          }
          const url = URL.createObjectURL(file);
          objectUrls[idx] = url;
          imgEl.onload = () => {
            // keep URL until cleared to allow re-render without GC
          };
          imgEl.src = url;
          imgEl.hidden = false;
          setFileName(idx, file.name);
        }

        uploadInputs.forEach((inp, i) => {
          if (!inp) return;
          inp.addEventListener("change", () => {
            const file = inp.files && inp.files[0];
            if (file) handleUpload(i, file);
          });
        });
        clearButtons.forEach((btn, i) => {
          if (!btn) return;
          btn.addEventListener("click", () => clearOverlay(i));
        });

        function updateName() {
          const text = nameInput.value.trim();
          nameBadge.textContent = text;
          nameBadge.style.display = text ? "block" : "none";
        }

        // NEW: helper to draw outlined text with outer-only outline
        function drawOutlinedText(
          ctx,
          text,
          x,
          y,
          fontSize,
          fontFamily,
          outlinePx,
          fillColor = "#5a3b13",
          outlineColor = "#ffffff"
        ) {
          if (!text) return;
          const { canvas } = ctx;
          const ow = canvas.width;
          const oh = canvas.height;
          const outlineCanvas = document.createElement("canvas");
          outlineCanvas.width = ow;
          outlineCanvas.height = oh;
          const octx = outlineCanvas.getContext("2d");
          octx.font = `${fontSize}px ${fontFamily}`;
          octx.textBaseline = "alphabetic";
          octx.textAlign = "left";
          octx.lineJoin = "round";

          // draw wider stroke, then punch out the inner fill to keep only the outer rim
          const strokeDrawWidth = Math.max(2, Math.round(outlinePx * 2));
          octx.strokeStyle = outlineColor;
          octx.lineWidth = strokeDrawWidth;
          octx.strokeText(text, x, y);

          octx.globalCompositeOperation = "destination-out";
          octx.fillStyle = "#000";
          octx.fillText(text, x, y);

          // paint outline then fill main text
          ctx.drawImage(outlineCanvas, 0, 0);
          ctx.font = `${fontSize}px ${fontFamily}`;
          ctx.textBaseline = "alphabetic";
          ctx.textAlign = "left";
          ctx.fillStyle = fillColor;
          ctx.fillText(text, x, y);
        }

        // PNG書き出し
        async function exportAsPNG() {
          try {
            // フォント読み込み完了を待つ
            if (document.fonts && document.fonts.ready) {
              try {
                await document.fonts.ready;
              } catch {}
            }

            const natW = img.naturalWidth || DEFAULT_W;
            const natH = img.naturalHeight || DEFAULT_H;

            const canvas = document.createElement("canvas");
            canvas.width = natW;
            canvas.height = natH;
            const ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";

            // ベース（カード）
            ctx.drawImage(img, 0, 0, natW, natH);

            // スタンプ（overlay1..8）
            for (const o of overlayImgs) {
              if (o && o.src && !o.hidden) {
                ctx.drawImage(o, 0, 0, natW, natH);
              }
            }

            // 名前（外側のみ白縁 → 本体の順で描画）
            const nameText = (nameInput.value || "").trim();
            if (nameText) {
              // 画面座標→自然サイズへ変換
              const boxRect = cardBox.getBoundingClientRect();
              const nmRect = nameBadge.getBoundingClientRect();
              const scaleX = natW / boxRect.width;
              const scaleY = natH / boxRect.height;

              const fsPx = parseFloat(
                getComputedStyle(nameBadge).fontSize || "0"
              );
              const fontSize = Math.max(1, Math.round(fsPx * scaleY));
              const nameX = Math.round((nmRect.left - boxRect.left) * scaleX);
              const nameY = Math.round(
                (nmRect.top - boxRect.top) * scaleY + fontSize
              );

              const fontFamily = "'Yusei Magic','Noto Sans JP',sans-serif";
              const outlineTarget = Math.max(1, Math.round(2 * scaleY));

              // REFACTORED: use helper
              drawOutlinedText(
                ctx,
                nameText,
                nameX,
                nameY,
                fontSize,
                fontFamily,
                outlineTarget,
                "#5a3b13",
                "#ffffff"
              );
            }

            // PNG化
            canvas.toBlob((blob) => {
              if (!blob) {
                alert(
                  "PNGの作成に失敗しました。外部画像のCORS制限の可能性があります。カード画像はローカルから選択するか、CORS許可の画像をご利用ください。"
                );
                return;
              }
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = "card.png";
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, "image/png");
          } catch (e) {
            console.error(e);
            alert("PNGの書き出しに失敗しました。");
          }
        }

        if (exportPngBtn) {
          exportPngBtn.addEventListener("click", exportAsPNG);
        }

        // カードURL適用（CORS考慮）
        function applyCardUrl() {
          const url = (cardUrlInput?.value || "").trim();
          if (!url) return;
          // CORS許可がある場合に備え crossOrigin を設定
          img.crossOrigin = "anonymous";
          img.referrerPolicy = "no-referrer";
          img.src = url;
          img
            .decode?.()
            .catch(() => {})
            .finally(scheduleUpdateCardBoxRect);
        }

        // object-fit: contain の実表示領域を計算し cardBox に反映
        function updateCardBoxRect() {
          if (!img || !frame || !cardBox) return;
          const fw = frame.clientWidth;
          const fh = frame.clientHeight;
          const natW = img.naturalWidth || DEFAULT_W;
          const natH = img.naturalHeight || DEFAULT_H;
          if (fw === 0 || fh === 0 || natW === 0 || natH === 0) return;
          const scale = Math.min(fw / natW, fh / natH);
          const drawW = natW * scale;
          const drawH = natH * scale;
          const offsetX = (fw - drawW) / 2;
          const offsetY = (fh - drawH) / 2;
          cardBox.style.left = offsetX + "px";
          cardBox.style.top = offsetY + "px";
          cardBox.style.width = drawW + "px";
          cardBox.style.height = drawH + "px";
          cardBox.style.setProperty("--card-w", `${drawW}px`);
          cardBox.style.setProperty("--card-h", `${drawH}px`);
          const scaleX = drawW / DEFAULT_W;
          const scaleY = drawH / DEFAULT_H;
          cardBox.style.setProperty("--card-scale-x", String(scaleX));
          cardBox.style.setProperty("--card-scale-y", String(scaleY));
        }

        // Listeners
        nameInput.addEventListener("input", updateName);
        if (applyCardBtn) applyCardBtn.addEventListener("click", applyCardUrl);
        if (cardUrlInput) {
          cardUrlInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") applyCardUrl();
          });
        }

        // 初期化
        updateName();
        updateCardBoxRect();

        // ページロード後
        window.addEventListener("load", () => {
          try {
            applyCardUrl();
          } catch (_) {}
          scheduleUpdateCardBoxRect();
        });
        window.addEventListener("resize", scheduleUpdateCardBoxRect);
        if (window.visualViewport) {
          window.visualViewport.addEventListener(
            "resize",
            scheduleUpdateCardBoxRect
          );
          window.visualViewport.addEventListener(
            "scroll",
            scheduleUpdateCardBoxRect
          );
        }
        img.addEventListener("load", scheduleUpdateCardBoxRect);

        // 16:9維持のフォールバックは不要（ビューポートフィット運用）
      })();
      // PWA: Service Worker 登録（対応ブラウザのみ）
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
